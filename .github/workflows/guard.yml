name: guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # actions 一律 pin 到 commit SHA（tag 可被移动，SHA 不会）：
      #   actions/checkout      v4.2.2
      #   actions/setup-python  v5.6.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      # 1) 写入前校验：只拦 violation，warn 允许存在（存量欠账不阻断，见 docs/05）
      - name: kb.py check（violation 必须为 0）
        run: |
          python3 vault/_kb/kb.py check | tee /tmp/check.txt
          if ! grep -q "violation 0" /tmp/check.txt; then
            echo "::error::存在 violation，拒绝合并"
            exit 1
          fi

      # 2) 关系回归
      - name: kb.py test（关系题集必须全过）
        run: python3 vault/_kb/kb.py test

      # 3) 单元测试
      - name: unittest
        run: python3 -m unittest discover -s vault/_kb -p "test_*.py" -v

      # 4) 规范与代码的关系计数必须相等（历史上出过 11/12/15 三个数并存，见 docs/09 F1）
      - name: 关系计数一致性
        run: |
          python3 - <<'PY'
          import re, sys
          sys.path.insert(0, "vault/_kb")
          import onto_rules as R
          doc = open("vault/_schema/ontology.md", encoding="utf-8").read()
          head = re.search(r"## 3\. 关系类型（([^）]*)）", doc)
          assert head, "ontology.md 缺少 §3 关系类型标题"
          text = head.group(1)
          assert "= 12" in text and "合计 15" in text, f"§3 标题计数口径不对：{text}"
          assert len(R.FORWARD) == 15, f"FORWARD 长度 {len(R.FORWARD)} != 15"
          assert len(R.DECISION_RELS) == 3, f"决策关系 {len(R.DECISION_RELS)} != 3"
          print(f"OK: 结构+治理 12，决策 3，合计 {len(R.FORWARD)}")
          PY

      # 5) 敏感串扫描
      #
      # ⚠️ 必须排除本文件自身（:!.github/workflows/guard.yml）。
      #    模式文本就写在这一步里，`git grep` 扫全仓时会把它当成命中物 →
      #    判据与被判对象是同一个集合，自指恒红（见 docs/09 F16）。
      #    排除留下的盲区，由下一步「workflow 自检」单独覆盖。
      #
      #    另排除两个**必须**写出危险模式的反例文件：
      #    SECURITY.md、docs/09-failure-modes.md。
      #
      #    ⚠️ 模式里只用 [[:space:]]，不用 \s。\s 是 GNU 扩展，
      #    macOS 的 BSD 正则引擎不认 → 本机跑同一模式会静默失效，
      #    而 CI（ubuntu/glibc）却是生效的，两边口径不一致（见 docs/09 F17）。
      - name: 敏感串扫描
        run: |
          set +e
          out=$(git grep -nE '(/Users/[A-Za-z]|/home/[A-Za-z]|BEGIN PRIVATE KEY|API_KEY=|api[_-]?key["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9]{16,})' \
                -- . ':!SECURITY.md' ':!docs/09-failure-modes.md' ':!.github/workflows/guard.yml')
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::发现疑似凭据或本机绝对路径"
            exit 1
          fi
          echo "OK: 0 命中"

      # 6) workflow 自检：补上一步排除自身留下的盲区。
      #    这里不扫字面量（会再次自命中），只断言**结构**：
      #    本仓库不需要任何凭据，所以不该出现 secrets 引用，也不该出现凭据型 env 赋值。
      - name: workflow 自检
        run: |
          f=.github/workflows/guard.yml
          if grep -nE 'secrets\.' "$f"; then
            echo "::error::workflow 引用了 secrets，本仓库不需要任何凭据"
            exit 1
          fi
          # 形如 `  TOKEN: abc` / `  API_KEY: sk-...` 的 YAML 赋值
          if grep -nE '^\s+[A-Z0-9_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z0-9_]*\s*:\s*\S' "$f"; then
            echo "::error::workflow 出现形似凭据的环境变量赋值"
            exit 1
          fi
          echo "OK: 无 secrets 引用、无凭据型 env 赋值"

      # 7) 示例库规模断言：防止误把真实卡片带进来
      - name: 示例库规模
        run: |
          n=$(find vault/cards vault/decisions -name '*.md' | wc -l | tr -d ' ')
          echo "卡片数：$n"
          if [ "$n" -ne 11 ]; then
            echo "::error::示例库应为 11 张卡（9 知识 + 2 决策），实为 $n。若有意变更，请同步更新本条断言与本步骤注释。"
            exit 1
          fi

      # 8) 失败模式条数一致性：标题写 N 条，就必须真有 N 条，且 4 处引用同口径。
      #    历史上同一个数字在标题、表格、代码里出现过三个值（F1），这条是它的复发点。
      - name: 失败模式条数一致性
        run: |
          python3 - <<'PY'
          import re, pathlib
          doc = pathlib.Path("docs/09-failure-modes.md").read_text(encoding="utf-8")
          m = re.search(r"^# 09 · (\d+) 条失败模式", doc, re.M)
          assert m, "docs/09 缺少『# 09 · N 条失败模式』标题"
          declared = int(m.group(1))
          nums = [int(x) for x in re.findall(r"^## F(\d+) ", doc, re.M)]
          assert nums == list(range(1, len(nums) + 1)), f"F 编号不连续：{nums}"
          assert declared == len(nums), f"标题写 {declared} 条，实际 {len(nums)} 条"
          for f, pat in [("README.md", r"\[09 (\d+) 条失败模式\]"),
                         ("docs/00-index.md", r"\| (\d+) 条失败模式 \|"),
                         ("CHANGELOG.md", r"含 (\d+) 条失败模式")]:
              t = pathlib.Path(f).read_text(encoding="utf-8")
              mm = re.search(pat, t)
              assert mm, f"{f} 找不到条数声明"
              assert int(mm.group(1)) == declared, f"{f} 写 {mm.group(1)}，与 docs/09 的 {declared} 不一致"
          tpl = pathlib.Path(".github/ISSUE_TEMPLATE/failure-mode.md").read_text(encoding="utf-8")
          mm = re.search(r"建议编号 F(\d+)", tpl)
          assert mm, "failure-mode 模板缺少『建议编号 F..』"
          assert int(mm.group(1)) == len(nums) + 1, f"模板建议 F{mm.group(1)}，应为 F{len(nums) + 1}"
          print(f"OK: {len(nums)} 条，编号 1..{len(nums)} 连续，4 处口径一致，模板指向 F{len(nums) + 1}")
          PY

      # 9) URL 占位符残留：用户名的占位**忘了替换**，发布后就是 404。
      #    首推后 B 段 T07 逐条探活，抓到 https://github.com/OWNER/ontology-kb → 404。
      #
      #    本步与 preflight G10 故意**互补不重复**：
      #      G10 管「一看就没填」的形态——尖括号包着的占位词、全大写下划线的模板变量、待办标记
      #      本步只管它抓不到的形态——链接里直接写了用户名占位，一个尖括号都没有
      #    因此这里只出现无尖括号的那两种。**注释里也不许举尖括号例子**：
      #    举了就等于把 G10 的靶子贴到自己文件上（又一次自命中，见 F16）。
      #    本文件同样排除于扫描之外，理由同步骤 5。
      - name: URL 占位符残留
        run: |
          set +e
          out=$(git grep -nE '(github\.com/OWNER|OWNER/ontology)' \
                -- '*.md' '*.cff' '*.json' '*.yml' \
                ':!docs/09-failure-modes.md' ':!.github/workflows/guard.yml')
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::链接里残留用户名占位符，发布后是 404"
            exit 1
          fi
          echo "OK: 0 命中"
